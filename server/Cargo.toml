[package]
name = "cea-language-server"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Language server for Cheat Engine Auto Assembler scripts"
repository = "https://codeberg.org/alaestor/zed-cea"

[dependencies]
tokio = { version = "1.46", features = ["io-std", "macros", "rt-multi-thread", "sync"] }
tower-lsp = "0.20"
tree-sitter = "0.26"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
serde_json = "1.0"
