[package]
name = "cea-language-server"
version = "0.3.0"
edition = "2021"
license = "MIT"
description = "Language server for Cheat Engine Auto Assembler scripts"
repository = "https://codeberg.org/alaestor/zed-cea"

[dependencies]
serde = "1.0"
serde_json = "1.0"
tokio = { version = "1.46", features = ["io-std", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tower-lsp = "0.20"
tree-sitter = "0.26"

[build-dependencies]
cc = "1.2"
